http:
  address: 0.0.0.0:8080 # Define a porta da Web UI como 8080 nativamente no Git!
  session_ttl: 720h

dns:
  bind_hosts:
    - 0.0.0.0
  port: 53
  upstream_dns:
    - https://dns.cloudflare-dns.com/dns-query
    - 1.1.1.1

dhcp:
  enabled: true
  interface_name: end0 # Já vem pré-configurado para a interface end0 do Armbian
  dhcpv4:
    gateway_ip: 192.168.1.1
    subnet_mask: 255.255.255.0
    range_start: 192.168.1.50
    range_end: 192.168.1.200
    lease_duration: 86400
  dhcpv6:
    range_start: ""
    lease_duration: 86400