server:
  proxied: true

branding:
  app-name: Homelab

pages:
  - name: Home
    columns:
      - size: small
        widgets:
          - type: clock
            hour-format: 24h
          
          - type: calendar
            first-day-of-week: monday

          - type: rss
            title: Atualizações
            limit: 5
            collapse-after: 3
            feeds:
              - url: https://news.ycombinator.com/rss
                title: Hacker News
              - url: https://www.reddit.com/r/selfhosted/.rss
                title: r/selfhosted
              - url: https://www.reddit.com/r/homelab/.rss
                title: r/homelab
              - url: https://www.phoronix.com/rss.php
                title: Phoronix

      - size: full
        widgets:
          - type: search
            autofocus: true
          
          - type: custom-api
            title: Clima
            cache: 30m
            url: https://api.openweathermap.org/data/2.5/weather?lat=-23.5427842&lon=-46.3108391&appid=${OPENWATERMAP_APIKEY}&units=metric&lang=pt_br
            template: |
              {{ if eq .Response.StatusCode 200 }}
              <div class="flex items-center gap-10">
                <span class="size-h1 color-highlight">{{ printf "%.1f" (.JSON.Float "main.temp") }} °C</span>
                <img src="https://openweathermap.org/img/wn/{{ .JSON.String "weather.0.icon" }}@2x.png" alt="{{ .JSON.String "weather.0.description" }}" width="56" height="56">
              </div>
              <p class="size-h4">{{ .JSON.String "name" }} · {{ .JSON.String "weather.0.description" }}</p>
              <p class="size-h6 color-paragraph">Sensação {{ printf "%.1f" (.JSON.Float "main.feels_like") }} °C · Umidade {{ .JSON.Int "main.humidity" }}%</p>
              {{ else }}
              <p>OpenWeatherMap indisponível (HTTP {{ .Response.StatusCode }})</p>
              {{ end }}

          - type: monitor
            title: Estado do Sistema
            cache: 1m
            sites:
              - title: AdGuard Home
                url: https://adguard.arpa
                icon: mdi:shield-check
                allow-insecure: true
              - title: Roteador
                url: http://192.168.1.1
                icon: mdi:router-network
                allow-insecure: true
              - title: Internet
                url: https://1.1.1.1
                icon: mdi:earth

          - type: custom-api
            title: Hardware
            cache: 15s
            url: https://glances.arpa/api/4/all
            allow-insecure: true
            template: |
              <div class="flex items-center justify-between">
                <span>CPU</span>
                <strong>{{ printf "%.0f" (.JSON.Float "cpu.total") }}%</strong>
              </div>
              <div class="flex items-center justify-between">
                <span>RAM</span>
                <strong>{{ printf "%.0f" (.JSON.Float "mem.percent") }}%</strong>
              </div>
              <div class="flex items-center justify-between">
                <span>Load</span>
                <strong>{{ printf "%.2f" (.JSON.Float "load.min1") }}</strong>
              </div>

          - type: bookmarks
            groups:
              - title: Infraestrutura & Rede
                links:
                  - title: AdGuard Home
                    url: https://adguard.arpa
                    icon: mdi:shield-check
                  - title: Glances
                    url: https://glances.arpa
                    icon: mdi:cpu-64-bit