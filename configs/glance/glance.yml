server:
  proxied: true

branding:
  app-name: Homelab

pages:
  - name: Home
    columns:
      - size: small
        widgets:
          - type: clock
            hour-format: 24h
          
          - type: calendar
            first-day-of-week: monday

          - type: rss
            title: Atualizações
            limit: 5
            collapse-after: 3
            feeds:
              - url: https://news.ycombinator.com/rss
                title: Hacker News
              - url: https://www.reddit.com/r/selfhosted/.rss
                title: r/selfhosted
              - url: https://www.reddit.com/r/homelab/.rss
                title: r/homelab
              - url: https://www.phoronix.com/rss.php
                title: Phoronix

      - size: full
        widgets:
          - type: search
            autofocus: true
          
          - type: custom-api
            title: Clima
            cache: 30m
            url: https://api.openweathermap.org/data/2.5/weather?lat=-23.5427842&lon=-46.3108391&appid=${OPENWATERMAP_APIKEY}&units=metric&lang=pt_br
            template: |
              {{ if eq .Response.StatusCode 200 }}
              <div class="flex items-center gap-10">
                <span class="size-h1 color-highlight">{{ printf "%.1f" (.JSON.Float "main.temp") }} °C</span>
                <img src="https://openweathermap.org/img/wn/{{ .JSON.String "weather.0.icon" }}@2x.png" alt="{{ .JSON.String "weather.0.description" }}" width="56" height="56">
              </div>
              <p class="size-h4">{{ .JSON.String "name" }} · {{ .JSON.String "weather.0.description" }}</p>
              <p class="size-h6 color-paragraph">Sensação {{ printf "%.1f" (.JSON.Float "main.feels_like") }} °C · Umidade {{ .JSON.Int "main.humidity" }}%</p>
              {{ else }}
              <p>OpenWeatherMap indisponível (HTTP {{ .Response.StatusCode }})</p>
              {{ end }}

          - type: monitor
            title: Estado do Sistema
            cache: 1m
            sites:
              - title: AdGuard Home
                url: https://adguard.arpa
                icon: mdi:shield-check
                allow-insecure: true
              - title: Roteador
                url: http://192.168.1.1
                icon: mdi:router-network
                allow-insecure: true
              - title: Internet
                url: https://1.1.1.1
                icon: mdi:earth

          - type: custom-api
            cache: 30s
            title: SERVER STATS
            options:
              glances-url: "http://192.168.1.113:61208"
              server-name: "Orange Pi"
              show-temperature: "true"
              show-disk-bar: "true"
              show-network: "false"
              network-interface: "end0"
            template: |
              {{ $glancesUrl := .Options.StringOr "glances-url" "http://127.0.0.1:61208" }}
              {{ $baseUrl := concat $glancesUrl "/api/4" }}
              {{ $serverName := .Options.StringOr "server-name" "Server" }}
              {{ $showTemp := eq (.Options.StringOr "show-temperature" "true") "true" }}
              {{ $showDiskBar := eq (.Options.StringOr "show-disk-bar" "true") "true" }}
              {{ $showNetwork := eq (.Options.StringOr "show-network" "false") "true" }}
              {{ $ifName := .Options.StringOr "network-interface" "eth0" }}

              {{ $cpu := newRequest (concat $baseUrl "/cpu") | getResponse }}
              {{ $mem := newRequest (concat $baseUrl "/mem") | getResponse }}
              {{ $fs := newRequest (concat $baseUrl "/fs") | getResponse }}
              {{ $uptime := newRequest (concat $baseUrl "/uptime") | getResponse }}
              {{ $swap := newRequest (concat $baseUrl "/memswap") | getResponse }}
              {{ $net := newRequest (concat $baseUrl "/network") | getResponse }}
              {{ $sensors := newRequest (concat $baseUrl "/sensors") | getResponse }}

              {{ $isOnline := and (eq $cpu.Response.StatusCode 200) (eq $mem.Response.StatusCode 200) }}

              {{ if $isOnline }}
                {{ $cpuPercent := $cpu.JSON.Float "total" | toInt }}
                {{ $memPercent := $mem.JSON.Float "percent" | toInt }}
                {{ $memUsedGB := div ($mem.JSON.Float "used") 1073741824 }}
                {{ $memTotalGB := div ($mem.JSON.Float "total") 1073741824 }}

                {{ $swapUsedMB := 0 }}
                {{ $swapTotalMB := 0 }}
                {{ if eq $swap.Response.StatusCode 200 }}
                  {{ $swapUsedMB = div ($swap.JSON.Float "used") 1048576 | toInt }}
                  {{ $swapTotalMB = div ($swap.JSON.Float "total") 1048576 | toInt }}
                {{ end }}

                {{ $uptimeStr := "" }}
                {{ if eq $uptime.Response.StatusCode 200 }}
                  {{ $uptimeStr = $uptime.JSON.String "" }}
                {{ end }}

                {{ $temperature := 0 }}
                {{ if and $showTemp (eq $sensors.Response.StatusCode 200) }}
                  {{ range $sensors.JSON.Array "" }}
                    {{ $type := .String "type" }}
                    {{ $unit := .String "unit" }}
                    {{ $valueInt := .Float "value" | toInt }}
                    {{ if and (eq $type "temperature_core") (eq $unit "C") (gt $valueInt 0) }}
                      {{ if gt $valueInt 200 }}
                        {{ $temperature = div $valueInt 1000 }}
                      {{ else }}
                        {{ $temperature = $valueInt }}
                      {{ end }}
                    {{ end }}
                  {{ end }}
                {{ end }}

                {{ $netDownMBs := 0.0 }}
                {{ $netUpMBs := 0.0 }}
                {{ if and $showNetwork (eq $net.Response.StatusCode 200) }}
                  {{ range $net.JSON.Array "" }}
                    {{ if eq (.String "interface_name") $ifName }}
                      {{ $netDownMBs = div (.Float "bytes_recv_rate_per_sec") 1048576 }}
                      {{ $netUpMBs = div (.Float "bytes_sent_rate_per_sec") 1048576 }}
                    {{ end }}
                  {{ end }}
                {{ end }}

                <style>
                  .server-container { padding: 0.5rem; }
                  .server-header {
                    display: flex;
                    justify-content: space-between;
                    align-items: center;
                    margin-bottom: 1rem;
                    padding-bottom: 0.75rem;
                    border-bottom: 1px solid var(--color-separator);
                  }
                  .server-name-link {
                    color: var(--color-text-subdue);
                    text-decoration: none;
                    transition: color 0.2s;
                  }
                  .server-name-link:hover { color: var(--color-primary); }
                  .services-section {
                    margin-bottom: 1rem;
                    display: flex;
                    align-items: center;
                    gap: 0.5rem;
                  }
                  .status-indicator {
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    width: 1.5rem;
                    height: 1.5rem;
                    border-radius: 50%;
                    background: #22c55e;
                    flex-shrink: 0;
                  }
                  .status-indicator.offline { background: #ef4444; }
                  .status-icon { width: 1rem; height: 1rem; color: white; }
                  .services-info { flex: 1; }
                  .uptime-temp-row {
                    display: flex;
                    align-items: center;
                    gap: 0.5rem;
                    justify-content: space-between;
                  }
                  .temp-display {
                    padding: 0.25rem 0.6rem;
                    border-radius: 4px;
                    white-space: nowrap;
                  }
                  .temp-low { background: rgba(34, 197, 94, 0.15); color: #22c55e; }
                  .temp-medium { background: rgba(234, 179, 8, 0.15); color: #eab308; }
                  .temp-high { background: rgba(239, 68, 68, 0.15); color: #ef4444; }
                  .metrics-grid {
                    display: grid;
                    grid-template-columns: repeat(3, 1fr);
                    gap: 0.75rem;
                    margin-bottom: 1rem;
                  }
                  .metric-card {
                    background: var(--color-widget-background);
                    border: 1px solid var(--color-separator);
                    border-radius: var(--border-radius);
                    padding: 0.75rem;
                    text-align: center;
                  }
                  .metric-bar {
                    width: 100%;
                    height: 4px;
                    background: var(--color-separator);
                    border-radius: 2px;
                    overflow: hidden;
                    margin-top: 0.5rem;
                    position: relative;
                  }
                  .metric-bar-fill {
                    height: 100%;
                    position: absolute;
                    left: 0;
                    top: 0;
                    transition: width 0.3s ease;
                  }
                  .bar-low { background: linear-gradient(90deg, #22c55e 0%, #16a34a 100%); }
                  .bar-medium { background: linear-gradient(90deg, #eab308 0%, #ca8a04 100%); }
                  .bar-high { background: linear-gradient(90deg, #ef4444 0%, #dc2626 100%); }
                  .memory-section {
                    background: var(--color-widget-background);
                    border: 1px solid var(--color-separator);
                    border-radius: var(--border-radius);
                    padding: 0.75rem;
                    margin-bottom: 1rem;
                  }
                  .memory-row {
                    display: flex;
                    justify-content: space-between;
                    align-items: center;
                    padding: 0.4rem 0;
                  }
                  .disks-section {
                    background: var(--color-widget-background);
                    border: 1px solid var(--color-separator);
                    border-radius: var(--border-radius);
                    padding: 0.75rem;
                    margin-bottom: 1rem;
                  }
                  .disk-item { margin-bottom: 0.75rem; }
                  .disk-item:last-child { margin-bottom: 0; }
                  .disk-header {
                    display: flex;
                    justify-content: space-between;
                    align-items: center;
                    margin-bottom: 0.35rem;
                  }
                  .network-section {
                    display: grid;
                    grid-template-columns: 1fr 1fr;
                    gap: 0.75rem;
                  }
                  .network-card {
                    background: var(--color-widget-background);
                    border: 1px solid var(--color-separator);
                    border-radius: var(--border-radius);
                    padding: 0.75rem;
                    text-align: center;
                  }
                  .icon-server { width: 1.5rem; height: 1.5rem; }
                </style>

                <div class="server-container">
                  <div class="server-header">
                    {{ if ne $glancesUrl "" }}
                    <a href="{{ $glancesUrl }}" target="_blank" class="server-name-link">
                      <span class="size-h6 color-subdue" style="font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;">{{ $serverName }}</span>
                    </a>
                    {{ else }}
                    <span class="size-h6 color-subdue" style="font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;">{{ $serverName }}</span>
                    {{ end }}
                    <svg class="icon-server" viewBox="0 0 24 24" fill="currentColor">
                      <path d="M4,1H20A1,1 0 0,1 21,2V6A1,1 0 0,1 20,7H4A1,1 0 0,1 3,6V2A1,1 0 0,1 4,1M4,9H20A1,1 0 0,1 21,10V14A1,1 0 0,1 20,15H4A1,1 0 0,1 3,14V10A1,1 0 0,1 4,9M4,17H20A1,1 0 0,1 21,18V22A1,1 0 0,1 20,23H4A1,1 0 0,1 3,22V18A1,1 0 0,1 4,17M5,4V5H7V4H5M5,12V13H7V12H5M5,20V21H7V20H5M9,4V5H11V4H9M9,12V13H11V12H9M9,20V21H11V20H9Z"/>
                    </svg>
                  </div>

                  <div class="services-section">
                    <div class="status-indicator">
                      <svg class="status-icon" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M21,7L9,19L3.5,13.5L4.91,12.09L9,16.17L19.59,5.59L21,7Z"/>
                      </svg>
                    </div>
                    <div class="services-info">
                      <div class="size-h5" style="margin-bottom: 0.15rem;">Services</div>
                      <div class="uptime-temp-row">
                        {{ if ne $uptimeStr "" }}
                        <span class="size-h6 color-subdue">{{ $uptimeStr }} uptime</span>
                        {{ end }}
                        {{ if and $showTemp (gt $temperature 0) }}
                        <span class="size-h6 temp-display {{ if lt $temperature 65 }}temp-low{{ else if lt $temperature 80 }}temp-medium{{ else }}temp-high{{ end }}">{{ $temperature }}°C</span>
                        {{ end }}
                      </div>
                    </div>
                  </div>

                  <div class="metrics-grid">
                    <div class="metric-card">
                      <div class="size-h6 color-subdue" style="text-transform: uppercase; margin-bottom: 0.5rem;">CPU</div>
                      <div class="size-h2" style="font-weight: 700; margin-bottom: 0.25rem;">{{ $cpuPercent }}%</div>
                      <div class="metric-bar">
                        <div class="metric-bar-fill {{ if lt $cpuPercent 60 }}bar-low{{ else if lt $cpuPercent 80 }}bar-medium{{ else }}bar-high{{ end }}" style="width: {{ $cpuPercent }}%"></div>
                      </div>
                    </div>

                    <div class="metric-card">
                      <div class="size-h6 color-subdue" style="text-transform: uppercase; margin-bottom: 0.5rem;">RAM</div>
                      <div class="size-h2" style="font-weight: 700; margin-bottom: 0.25rem;">{{ $memPercent }}%</div>
                      <div class="metric-bar">
                        <div class="metric-bar-fill {{ if lt $memPercent 60 }}bar-low{{ else if lt $memPercent 80 }}bar-medium{{ else }}bar-high{{ end }}" style="width: {{ $memPercent }}%"></div>
                      </div>
                    </div>

                    <div class="metric-card">
                      <div class="size-h6 color-subdue" style="text-transform: uppercase; margin-bottom: 0.5rem;">DISK</div>
                      <div class="size-h2" style="font-weight: 700; margin-bottom: 0.25rem;">
                        {{ $totalDiskPercent := 0 }}
                        {{ $diskCount := 0 }}
                        {{ range $fs.JSON.Array "" }}
                          {{ $totalDiskPercent = add $totalDiskPercent (.Float "percent" | toInt) }}
                          {{ $diskCount = add $diskCount 1 }}
                        {{ end }}
                        {{ if gt $diskCount 0 }}{{ div $totalDiskPercent $diskCount }}%{{ else }}0%{{ end }}
                      </div>
                      {{ if $showDiskBar }}
                      <div class="metric-bar">
                        {{ $avgPercent := 0 }}
                        {{ $diskCount := 0 }}
                        {{ range $fs.JSON.Array "" }}
                          {{ $avgPercent = add $avgPercent (.Float "percent" | toInt) }}
                          {{ $diskCount = add $diskCount 1 }}
                        {{ end }}
                        {{ if gt $diskCount 0 }}{{ $avgPercent = div $avgPercent $diskCount }}{{ end }}
                        <div class="metric-bar-fill {{ if lt $avgPercent 60 }}bar-low{{ else if lt $avgPercent 80 }}bar-medium{{ else }}bar-high{{ end }}" style="width: {{ $avgPercent }}%"></div>
                      </div>
                      {{ end }}
                    </div>
                  </div>

                  <div class="memory-section">
                    <div class="memory-row">
                      <span class="size-h6 color-subdue" style="text-transform: uppercase;">RAM</span>
                      <span class="size-h6" style="font-weight: 500;">{{ $memUsedGB | printf "%.1f" }} GB / {{ $memTotalGB | printf "%.1f" }} GB</span>
                    </div>
                    {{ if gt $swapTotalMB 0 }}
                    <div class="memory-row">
                      <span class="size-h6 color-subdue" style="text-transform: uppercase;">SWAP</span>
                      <span class="size-h6" style="font-weight: 500;">{{ $swapUsedMB }} MB / {{ $swapTotalMB }} MB</span>
                    </div>
                    {{ end }}
                  </div>

                  {{ if eq $fs.Response.StatusCode 200 }}
                  <div class="disks-section">
                    {{ $device1 := "" }}
                    {{ $device2 := "" }}
                    {{ $device3 := "" }}
                    {{ $device4 := "" }}
                    {{ $device5 := "" }}
                    {{ range $fs.JSON.Array "" }}
                      {{ $deviceName := .String "device_name" }}
                      {{ $isNewDevice := true }}
                      {{ if or (eq $deviceName $device1) (eq $deviceName $device2) (eq $deviceName $device3) (eq $deviceName $device4) (eq $deviceName $device5) }}
                        {{ $isNewDevice = false }}
                      {{ end }}
                      {{ if and $isNewDevice (ne $deviceName "") }}
                        {{ if eq $device1 "" }}
                          {{ $device1 = $deviceName }}
                        {{ else if eq $device2 "" }}
                          {{ $device2 = $deviceName }}
                        {{ else if eq $device3 "" }}
                          {{ $device3 = $deviceName }}
                        {{ else if eq $device4 "" }}
                          {{ $device4 = $deviceName }}
                        {{ else if eq $device5 "" }}
                          {{ $device5 = $deviceName }}
                        {{ end }}
                        {{ $diskPercent := .Float "percent" | toInt }}
                        {{ $diskUsedGB := div (.Float "used") 1073741824 }}
                        {{ $diskTotalGB := div (.Float "size") 1073741824 }}
                        {{ $diskTotalGBInt := $diskTotalGB | toInt }}
                        <div class="disk-item">
                          <div class="disk-header">
                            <span class="size-h6 color-subdue" style="text-transform: uppercase;">{{ $deviceName }}</span>
                            {{ if gt $diskTotalGBInt 1000 }}
                            <span class="size-h6" style="font-weight: 500;">{{ div $diskUsedGB 1024 | printf "%.1f" }} TB / {{ div $diskTotalGB 1024 | printf "%.1f" }} TB</span>
                            {{ else }}
                            <span class="size-h6" style="font-weight: 500;">{{ $diskUsedGB | printf "%.1f" }} GB / {{ $diskTotalGB | printf "%.1f" }} GB</span>
                            {{ end }}
                          </div>
                          {{ if $showDiskBar }}
                          <div class="metric-bar">
                            <div class="metric-bar-fill {{ if lt $diskPercent 60 }}bar-low{{ else if lt $diskPercent 80 }}bar-medium{{ else }}bar-high{{ end }}" style="width: {{ $diskPercent }}%"></div>
                          </div>
                          {{ end }}
                        </div>
                      {{ end }}
                    {{ end }}
                  </div>
                  {{ end }}

                  {{ if $showNetwork }}
                  <div class="network-section">
                    <div class="network-card">
                      <div class="size-h6 color-subdue" style="text-transform: uppercase; margin-bottom: 0.5rem;">↓ Download</div>
                      <div class="size-h4 color-highlight" style="font-weight: 700;">{{ $netDownMBs | printf "%.2f" }} MB/s</div>
                    </div>
                    <div class="network-card">
                      <div class="size-h6 color-subdue" style="text-transform: uppercase; margin-bottom: 0.5rem;">↑ Upload</div>
                      <div class="size-h4 color-highlight" style="font-weight: 700;">{{ $netUpMBs | printf "%.2f" }} MB/s</div>
                    </div>
                  </div>
                  {{ end }}
                </div>
              {{ else }}
                <div class="server-container">
                  <div class="server-header">
                    <span class="size-h6 color-subdue" style="font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;">{{ $serverName }}</span>
                    <svg class="icon-server" viewBox="0 0 24 24" fill="currentColor">
                      <path d="M4,1H20A1,1 0 0,1 21,2V6A1,1 0 0,1 20,7H4A1,1 0 0,1 3,6V2A1,1 0 0,1 4,1M4,9H20A1,1 0 0,1 21,10V14A1,1 0 0,1 20,15H4A1,1 0 0,1 3,14V10A1,1 0 0,1 4,9M4,17H20A1,1 0 0,1 21,18V22A1,1 0 0,1 20,23H4A1,1 0 0,1 3,22V18A1,1 0 0,1 4,17M5,4V5H7V4H5M5,12V13H7V12H5M5,20V21H7V20H5M9,4V5H11V4H9M9,12V13H11V12H9M9,20V21H11V20H9Z"/>
                    </svg>
                  </div>
                  <div class="services-section">
                    <div class="status-indicator offline">
                      <svg class="status-icon" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M19,6.41L17.59,5L12,10.59L6.41,5L5,6.41L10.59,12L5,17.59L6.41,19L12,13.41L17.59,19L19,17.59L13.41,12L19,6.41Z"/>
                      </svg>
                    </div>
                    <div class="services-info">
                      <div class="size-h5" style="margin-bottom: 0.15rem;">Services</div>
                      <div class="size-h6 color-negative">Offline</div>
                    </div>
                  </div>
                  <p class="color-negative" style="text-align: center; margin-top: 1rem;">Failed to fetch server data</p>
                </div>
              {{ end }}

          - type: custom-api
            title: Docker Swarm
            url: http://glance-docker-swarm-proxy:2375/services
            cache: 1m
            template: |
              {{/* Define base URL and colors as template variables - CHANGE THIS TO MATCH YOUR SETUP */}}
              {{ $baseURL := "http://glance-docker-swarm-proxy:2375" }}
              {{ $nodesColor := "204 93 53" }}
              {{ $servicesColor := "147 64 44" }}
              
              <style>
                /* Match bookmark icon sizing */
                .docker-container-icon {
                  display: block;
                  filter: grayscale(0.4);
                  object-fit: contain;
                  aspect-ratio: 1 / 1;
                  width: 2rem;
                  height: 2rem;
                  opacity: 0.8;
                  transition: filter 0.3s, opacity 0.3s;
                }
                
                .docker-container-icon.flat-icon {
                  opacity: 0.7;
                }
                
                .docker-container:hover .docker-container-icon {
                  opacity: 1;
                }
                
                .docker-container:hover .docker-container-icon:not(.flat-icon) {
                  filter: grayscale(0);
                }
                
                .docker-container-status-icon {
                  width: 2rem;
                  height: 2rem;
                }
                
                /* Match bookmark text sizing and alignment */
                .service-name {
                  flex: 1;
                  min-width: 0;
                }
                
                .service-name a,
                .service-name span {
                  display: block;
                  overflow: hidden;
                  text-overflow: ellipsis;
                  white-space: nowrap;
                  font-size: var(--font-size-base);
                  line-height: 2rem;
                }
                
                .service-replicas {
                  flex-shrink: 0;
                  font-size: var(--font-size-h5);
                  color: var(--color-text-base);
                  padding: 0.125rem 0.5rem;
                  background: var(--color-background-hover);
                  border-radius: var(--border-radius);
                  white-space: nowrap;
                }
                
                /* Section header styles - match bookmark group titles */
                .section-header {
                  font-size: var(--font-size-h3);
                  font-weight: 400;
                  margin-bottom: 1rem;
                  text-transform: capitalize;
                }
                
                /* Horizontal separator */
                .section-separator {
                  height: 1px;
                  background: var(--color-separator);
                  margin: 1.5rem 0;
                }
                
                /* Node hostname styling - match bookmark text */
                .node-hostname {
                  flex: 1;
                  min-width: 0;
                  font-size: var(--font-size-base);
                  line-height: 2rem;
                  overflow: hidden;
                  text-overflow: ellipsis;
                  white-space: nowrap;
                }
                
                .node-role {
                  flex-shrink: 0;
                  font-size: var(--font-size-h5);
                  color: var(--color-text-base);
                  padding: 0.125rem 0.5rem;
                  background: var(--color-background-hover);
                  border-radius: var(--border-radius);
                  text-transform: capitalize;
                }
                
                /* Ensure vertical alignment */
                .docker-container {
                  align-items: center;
                }
                
                /* Child service styles in popover */
                .child-service {
                  display: flex;
                  align-items: center;
                  gap: 0.5rem;
                  padding: 0.25rem 0;
                }
                
                .child-service-icon {
                  width: 1.25rem;
                  height: 1.25rem;
                  opacity: 0.8;
                }
                
                .child-service-name {
                  flex: 1;
                  font-size: var(--font-size-h5);
                }
                
                .child-service-status {
                  width: 1rem;
                  height: 1rem;
                }
              </style>
              
              {{/* Fetch nodes data */}}
              {{
                $nodesResponse := newRequest (concat $baseURL "/nodes")
                  | getResponse
              }}
              
              {{/* Count nodes */}}
              {{ $totalNodes := 0 }}
              {{ $readyNodes := 0 }}
              
              {{ if eq $nodesResponse.Response.StatusCode 200 }}
                {{ range $nodesResponse.JSON.Array "" }}
                  {{ $totalNodes = add $totalNodes 1 }}
                  {{ if eq (.String "Status.State") "ready" }}
                    {{ $readyNodes = add $readyNodes 1 }}
                  {{ end }}
                {{ end }}
              {{ end }}
              
              {{/* Count services - only count parent/standalone services */}}
              {{ $totalServices := 0 }}
              {{ $healthyServices := 0 }}
              
              {{ range .JSON.Array "" }}
                {{ $serviceID := .String "ID" }}
                {{ $serviceName := .String "Spec.Name" }}
                
                {{
                  $details := newRequest (concat $baseURL "/services/" $serviceID)
                    | getResponse
                }}
                
                {{ if eq $details.Response.StatusCode 200 }}
                  {{ $name := $details.JSON.String "Spec.Labels.glance\\.name" }}
                  {{ $glanceParent := $details.JSON.String "Spec.Labels.glance\\.parent" }}
                  
                  {{/* Only count if not a child service */}}
                  {{ if and $name (not $glanceParent) }}
                    {{ $totalServices = add $totalServices 1 }}
                    
                    {{ $isGlobal := $details.JSON.Exists "Spec.Mode.Global" }}
                    {{ $desired := $details.JSON.String "Spec.Mode.Replicated.Replicas" }}
                    
                    {{ if $isGlobal }}
                      {{ $healthyServices = add $healthyServices 1 }}
                    {{ else }}
                      {{
                        $tasks := newRequest (concat $baseURL "/tasks?filters={\"service\":[\"" $serviceName "\"]}")
                          | getResponse
                      }}
                      {{ if eq $tasks.Response.StatusCode 200 }}
                        {{ $runningCount := 0 }}
                        {{ range $tasks.JSON.Array "" }}
                          {{ if eq (.String "Status.State") "running" }}
                            {{ $runningCount = add $runningCount 1 }}
                          {{ end }}
                        {{ end }}
                        
                        {{ $runningStr := printf "%d" $runningCount }}
                        {{ if eq $runningStr $desired }}
                          {{ $healthyServices = add $healthyServices 1 }}
                        {{ end }}
                      {{ end }}
                    {{ end }}
                  {{ end }}
                {{ end }}
              {{ end }}
              
              {{/* NODES SECTION */}}
              <div class="section-header" style="color: hsl({{ $nodesColor }}); font-weight: 400;">Nodes: {{ $readyNodes }}/{{ $totalNodes }}</div>
              
              <ul class="list-gap-20 list-with-separator" style="display: flex; flex-wrap: wrap; gap: 1.25rem;">
                {{ if eq $nodesResponse.Response.StatusCode 200 }}
                  {{ range $nodesResponse.JSON.Array "" }}
                    {{ $nodeID := .String "ID" }}
                    {{ $nodeHostname := .String "Description.Hostname" }}
                    {{ $nodeRole := .String "Spec.Role" }}
                    {{ $nodeState := .String "Status.State" }}
                    {{ $nodeAvailability := .String "Spec.Availability" }}
                    {{ $isLeader := .Bool "ManagerStatus.Leader" }}
                    
                    {{/* Fetch node details for glance labels */}}
                    {{
                      $nodeDetails := newRequest (concat $baseURL "/nodes/" $nodeID)
                        | getResponse
                    }}
                    
                    {{ $nodeIcon := "" }}
                    {{ if eq $nodeDetails.Response.StatusCode 200 }}
                      {{ $nodeIcon = $nodeDetails.JSON.String "Spec.Labels.glance\\.icon" }}
                    {{ end }}
                    
                    {{ $statusClass := "warn" }}
                    {{ $statusText := "down" }}
                    
                    {{ if eq $nodeState "ready" }}
                      {{ if eq $nodeAvailability "active" }}
                        {{ $statusClass = "ok" }}
                        {{ $statusText = "ready" }}
                      {{ else if eq $nodeAvailability "pause" }}
                        {{ $statusClass = "paused" }}
                        {{ $statusText = "paused" }}
                      {{ else if eq $nodeAvailability "drain" }}
                        {{ $statusClass = "paused" }}
                        {{ $statusText = "draining" }}
                      {{ end }}
                    {{ end }}
                    
                    {{/* Process node icon */}}
                    {{ $iconUrl := "" }}
                    {{ $isFlat := false }}
                    
                    {{ if $nodeIcon }}
                      {{ if eq (findMatch "^si:" $nodeIcon) "si:" }}
                        {{ $iconName := trimPrefix "si:" $nodeIcon }}
                        {{ $iconUrl = concat "https://cdn.jsdelivr.net/npm/simple-icons@latest/icons/" $iconName ".svg" }}
                        {{ $isFlat = true }}
                      {{ else if eq (findMatch "^di:" $nodeIcon) "di:" }}
                        {{ $iconName := trimPrefix "di:" $nodeIcon }}
                        {{ if findMatch "\\.(svg|png)$" $iconName }}
                          {{ $iconUrl = concat "https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/" (replaceMatches ".*\\.(svg|png)$" "$1" $iconName) "/" $iconName }}
                        {{ else }}
                          {{ $iconUrl = concat "https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/" $iconName ".svg" }}
                        {{ end }}
                      {{ else if eq (findMatch "^sh:" $nodeIcon) "sh:" }}
                        {{ $iconName := trimPrefix "sh:" $nodeIcon }}
                        {{ if findMatch "\\.(svg|png)$" $iconName }}
                          {{ $iconUrl = concat "https://cdn.jsdelivr.net/gh/selfhst/icons/" (replaceMatches ".*\\.(svg|png)$" "$1" $iconName) "/" $iconName }}
                        {{ else }}
                          {{ $iconUrl = concat "https://cdn.jsdelivr.net/gh/selfhst/icons/svg/" $iconName ".svg" }}
                        {{ end }}
                      {{ else if eq (findMatch "^mdi:" $nodeIcon) "mdi:" }}
                        {{ $iconName := trimPrefix "mdi:" $nodeIcon }}
                        {{ $iconUrl = concat "https://cdn.jsdelivr.net/npm/@mdi/svg@latest/svg/" $iconName ".svg" }}
                        {{ $isFlat = true }}
                      {{ else if findMatch "^https?://" $nodeIcon }}
                        {{ $iconUrl = $nodeIcon }}
                      {{ else }}
                        {{ $iconUrl = $nodeIcon }}
                      {{ end }}
                    {{ else }}
                      {{ $iconUrl = "https://cdn.jsdelivr.net/npm/@mdi/svg@latest/svg/server.svg" }}
                      {{ $isFlat = true }}
                    {{ end }}
                    
                    <li class="docker-container flex items-center gap-15" style="flex: 1 1 0; min-width: 0; max-width: calc(33.333% - 0.84rem);">
                      <div class="shrink-0"
                           data-popover-type="text"
                           data-popover-position="above"
                           data-popover-text="{{ $nodeHostname }} - {{ $nodeRole }}{{ if $isLeader }} (leader){{ end }}"
                           aria-hidden="true">
                        <img src="{{ $iconUrl }}" 
                             class="docker-container-icon{{ if $isFlat }} flat-icon{{ end }}" 
                             alt="" 
                             loading="lazy">
                      </div>
                      
                      <div class="min-width-0 grow flex items-center gap-10">
                        <div class="node-hostname color-highlight" style="flex: 1; min-width: 0;">{{ $nodeHostname }}</div>
                        
                        <div class="node-role">
                          {{ $nodeRole }}{{ if $isLeader }} (leader){{ end }}
                        </div>
                      </div>
                      
                      <div class="shrink-0"
                           data-popover-type="text"
                           data-popover-position="above"
                           data-popover-text="{{ $statusText }}"
                           aria-label="{{ $statusText }}">
                        {{ if eq $statusClass "ok" }}
                          <svg class="docker-container-status-icon" fill="var(--color-positive)" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" aria-hidden="true">
                            <path fill-rule="evenodd" d="M10 18a8 8 0 1 0 0-16 8 8 0 0 0 0 16Zm3.857-9.809a.75.75 0 0 0-1.214-.882l-3.483 4.79-1.88-1.88a.75.75 0 1 0-1.06 1.061l2.5 2.5a.75.75 0 0 0 1.137-.089l4-5.5Z" clip-rule="evenodd" />
                          </svg>
                        {{ else if eq $statusClass "warn" }}
                          <svg class="docker-container-status-icon" fill="var(--color-negative)" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" aria-hidden="true">
                            <path fill-rule="evenodd" d="M8.485 2.495c.673-1.167 2.357-1.167 3.03 0l6.28 10.875c.673 1.167-.17 2.625-1.516 2.625H3.72c-1.347 0-2.189-1.458-1.515-2.625L8.485 2.495ZM10 5a.75.75 0 0 1 .75.75v3.5a.75.75 0 0 1-1.5 0v-3.5A.75.75 0 0 1 10 5Zm0 9a1 1 0 1 0 0-2 1 1 0 0 0 0 2Z" clip-rule="evenodd" />
                          </svg>
                        {{ else if eq $statusClass "paused" }}
                          <svg class="docker-container-status-icon" fill="var(--color-text-base)" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" aria-hidden="true">
                            <path fill-rule="evenodd" d="M2 10a8 8 0 1 1 16 0 8 8 0 0 1-16 0Zm5-2.25A.75.75 0 0 1 7.75 7h.5a.75.75 0 0 1 .75.75v4.5a.75.75 0 0 1-.75.75h-.5a.75.75 0 0 1-.75-.75v-4.5Zm4 0a.75.75 0 0 1 .75-.75h.5a.75.75 0 0 1 .75.75v4.5a.75.75 0 0 1-.75.75h-.5a.75.75 0 0 1-.75-.75v-4.5Z" clip-rule="evenodd" />
                          </svg>
                        {{ end }}
                      </div>
                    </li>
                  {{ end }}
                {{ else }}
                  <div class="text-center">Unable to fetch nodes data.</div>
                {{ end }}
              </ul>
              
              {{/* HORIZONTAL SEPARATOR */}}
              <div class="section-separator"></div>
              
              {{/* SERVICES SECTION */}}
              <div class="section-header" style="color: hsl({{ $servicesColor }}); font-weight: 400;">Services: {{ $healthyServices }}/{{ $totalServices }}</div>
              
              <ul class="dynamic-columns list-gap-20 list-with-separator">
                {{ range .JSON.Array "" }}
                  {{ $serviceID := .String "ID" }}
                  {{ $serviceName := .String "Spec.Name" }}
                  
                  {{
                    $details := newRequest (concat $baseURL "/services/" $serviceID)
                      | getResponse
                  }}
                  
                  {{ if eq $details.Response.StatusCode 200 }}
                    {{ $name := $details.JSON.String "Spec.Labels.glance\\.name" }}
                    {{ $glanceParent := $details.JSON.String "Spec.Labels.glance\\.parent" }}
                    
                    {{/* Only display if not a child service */}}
                    {{ if and $name (not $glanceParent) }}
                      {{ $glanceID := $details.JSON.String "Spec.Labels.glance\\.id" }}
                      {{ $icon := $details.JSON.String "Spec.Labels.glance\\.icon" }}
                      {{ $url := $details.JSON.String "Spec.Labels.glance\\.url" }}
                      {{ $description := $details.JSON.String "Spec.Labels.glance\\.description" }}
                      {{ $isGlobal := $details.JSON.Exists "Spec.Mode.Global" }}
                      {{ $desired := $details.JSON.String "Spec.Mode.Replicated.Replicas" }}
                      
                      {{ $running := "" }}
                      {{ $statusClass := "warn" }}
                      
                      {{ if not $isGlobal }}
                        {{
                          $tasks := newRequest (concat $baseURL "/tasks?filters={\"service\":[\"" $serviceName "\"]}")
                            | getResponse
                        }}
                        {{ if eq $tasks.Response.StatusCode 200 }}
                          {{ $runningCount := 0 }}
                          {{ range $tasks.JSON.Array "" }}
                            {{ if eq (.String "Status.State") "running" }}
                              {{ $runningCount = add $runningCount 1 }}
                            {{ end }}
                          {{ end }}
                          {{ $running = printf "%d" $runningCount }}
                          
                          {{ if eq $running $desired }}
                            {{ $statusClass = "ok" }}
                          {{ else if gt $runningCount 0 }}
                            {{ $statusClass = "paused" }}
                          {{ else }}
                            {{ $statusClass = "warn" }}
                          {{ end }}
                        {{ end }}
                      {{ else }}
                        {{ $statusClass = "ok" }}
                      {{ end }}
                      
                      {{/* Process icon */}}
                      {{ $iconUrl := "" }}
                      {{ $isFlat := false }}
                      
                      {{ if $icon }}
                        {{ if eq (findMatch "^si:" $icon) "si:" }}
                          {{ $iconName := trimPrefix "si:" $icon }}
                          {{ $iconUrl = concat "https://cdn.jsdelivr.net/npm/simple-icons@latest/icons/" $iconName ".svg" }}
                          {{ $isFlat = true }}
                        {{ else if eq (findMatch "^di:" $icon) "di:" }}
                          {{ $iconName := trimPrefix "di:" $icon }}
                          {{ if findMatch "\\.(svg|png)$" $iconName }}
                            {{ $iconUrl = concat "https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/" (replaceMatches ".*\\.(svg|png)$" "$1" $iconName) "/" $iconName }}
                          {{ else }}
                            {{ $iconUrl = concat "https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/" $iconName ".svg" }}
                          {{ end }}
                        {{ else if eq (findMatch "^sh:" $icon) "sh:" }}
                          {{ $iconName := trimPrefix "sh:" $icon }}
                          {{ if findMatch "\\.(svg|png)$" $iconName }}
                            {{ $iconUrl = concat "https://cdn.jsdelivr.net/gh/selfhst/icons/" (replaceMatches ".*\\.(svg|png)$" "$1" $iconName) "/" $iconName }}
                          {{ else }}
                            {{ $iconUrl = concat "https://cdn.jsdelivr.net/gh/selfhst/icons/svg/" $iconName ".svg" }}
                          {{ end }}
                        {{ else if eq (findMatch "^mdi:" $icon) "mdi:" }}
                          {{ $iconName := trimPrefix "mdi:" $icon }}
                          {{ $iconUrl = concat "https://cdn.jsdelivr.net/npm/@mdi/svg@latest/svg/" $iconName ".svg" }}
                          {{ $isFlat = true }}
                        {{ else if findMatch "^https?://" $icon }}
                          {{ $iconUrl = $icon }}
                        {{ else }}
                          {{ $iconUrl = $icon }}
                        {{ end }}
                      {{ else }}
                        {{ $iconUrl = "https://cdn.jsdelivr.net/npm/simple-icons@latest/icons/docker.svg" }}
                        {{ $isFlat = true }}
                      {{ end }}
                      
                      <li class="docker-container flex items-center gap-15">
                        <div class="shrink-0" 
                             data-popover-type="html" 
                             data-popover-position="above" 
                             data-popover-offset="0.25"
                             data-popover-margin="0.1rem"
                             data-popover-max-width="400px"
                             aria-hidden="true">
                          <img src="{{ $iconUrl }}" 
                               class="docker-container-icon{{ if $isFlat }} flat-icon{{ end }}" 
                               alt="" 
                               loading="lazy">
                          <div data-popover-html>
                            <div class="color-highlight text-truncate block">{{ $serviceName }}</div>
                            {{ if $isGlobal }}
                              <div>Mode: Global</div>
                            {{ else }}
                              <div>Replicas: {{ $running }}/{{ $desired }}</div>
                            {{ end }}
                            {{ if $description }}
                              <div class="margin-top-10 size-h5">{{ $description }}</div>
                            {{ end }}
                            
                            {{/* Display child services if this service has glance.id */}}
                            {{ if $glanceID }}
                              {{ $hasChildren := false }}
                              {{ range $.JSON.Array "" }}
                                {{ $childServiceID := .String "ID" }}
                                {{
                                  $childDetails := newRequest (concat $baseURL "/services/" $childServiceID)
                                    | getResponse
                                }}
                                {{ if eq $childDetails.Response.StatusCode 200 }}
                                  {{ $childParent := $childDetails.JSON.String "Spec.Labels.glance\\.parent" }}
                                  {{ if eq $childParent $glanceID }}
                                    {{ $hasChildren = true }}
                                  {{ end }}
                                {{ end }}
                              {{ end }}
                              
                              {{ if $hasChildren }}
                                <div class="margin-top-10">
                                  <div class="size-h5" style="font-weight: 600; margin-bottom: 0.5rem;">Related Services:</div>
                                  {{ range $.JSON.Array "" }}
                                    {{ $childServiceID := .String "ID" }}
                                    {{ $childServiceName := .String "Spec.Name" }}
                                    {{
                                      $childDetails := newRequest (concat $baseURL "/services/" $childServiceID)
                                        | getResponse
                                    }}
                                    {{ if eq $childDetails.Response.StatusCode 200 }}
                                      {{ $childParent := $childDetails.JSON.String "Spec.Labels.glance\\.parent" }}
                                      {{ if eq $childParent $glanceID }}
                                        {{ $childName := $childDetails.JSON.String "Spec.Labels.glance\\.name" }}
                                        {{ $childIcon := $childDetails.JSON.String "Spec.Labels.glance\\.icon" }}
                                        
                                        {{/* Get child status */}}
                                        {{ $childIsGlobal := $childDetails.JSON.Exists "Spec.Mode.Global" }}
                                        {{ $childDesired := $childDetails.JSON.String "Spec.Mode.Replicated.Replicas" }}
                                        {{ $childStatusClass := "warn" }}
                                        {{ $childRunning := "" }}
                                        
                                        {{ if $childIsGlobal }}
                                          {{ $childStatusClass = "ok" }}
                                          {{ $childRunning = "global" }}
                                        {{ else }}
                                          {{
                                            $childTasks := newRequest (concat $baseURL "/tasks?filters={\"service\":[\"" $childServiceName "\"]}")
                                              | getResponse
                                          }}
                                          {{ if eq $childTasks.Response.StatusCode 200 }}
                                            {{ $childRunningCount := 0 }}
                                            {{ range $childTasks.JSON.Array "" }}
                                              {{ if eq (.String "Status.State") "running" }}
                                                {{ $childRunningCount = add $childRunningCount 1 }}
                                              {{ end }}
                                            {{ end }}
                                            {{ $childRunning = printf "%d" $childRunningCount }}
                                            
                                            {{ if eq $childRunning $childDesired }}
                                              {{ $childStatusClass = "ok" }}
                                            {{ else if gt $childRunningCount 0 }}
                                              {{ $childStatusClass = "paused" }}
                                            {{ end }}
                                          {{ end }}
                                        {{ end }}
                                        
                                        {{/* Process child icon */}}
                                        {{ $childIconUrl := "" }}
                                        {{ if $childIcon }}
                                          {{ if eq (findMatch "^si:" $childIcon) "si:" }}
                                            {{ $childIconName := trimPrefix "si:" $childIcon }}
                                            {{ $childIconUrl = concat "https://cdn.jsdelivr.net/npm/simple-icons@latest/icons/" $childIconName ".svg" }}
                                          {{ else if eq (findMatch "^sh:" $childIcon) "sh:" }}
                                            {{ $childIconName := trimPrefix "sh:" $childIcon }}
                                            {{ if findMatch "\\.(svg|png)$" $childIconName }}
                                              {{ $childIconUrl = concat "https://cdn.jsdelivr.net/gh/selfhst/icons/" (replaceMatches ".*\\.(svg|png)$" "$1" $childIconName) "/" $childIconName }}
                                            {{ else }}
                                              {{ $childIconUrl = concat "https://cdn.jsdelivr.net/gh/selfhst/icons/svg/" $childIconName ".svg" }}
                                            {{ end }}
                                          {{ else if eq (findMatch "^mdi:" $childIcon) "mdi:" }}
                                            {{ $childIconName := trimPrefix "mdi:" $childIcon }}
                                            {{ $childIconUrl = concat "https://cdn.jsdelivr.net/npm/@mdi/svg@latest/svg/" $childIconName ".svg" }}
                                          {{ else }}
                                            {{ $childIconUrl = $childIcon }}
                                          {{ end }}
                                        {{ else }}
                                          {{ $childIconUrl = "https://cdn.jsdelivr.net/npm/simple-icons@latest/icons/docker.svg" }}
                                        {{ end }}
                                        
                                        <div class="child-service">
                                          <img src="{{ $childIconUrl }}" class="child-service-icon" alt="">
                                          <span class="child-service-name">{{ $childName }}</span>
                                          <span style="font-size: var(--font-size-h5); color: var(--color-text-base); margin-left: auto;">
                                            {{ if $childIsGlobal }}
                                              global
                                            {{ else }}
                                              {{ $childRunning }}/{{ $childDesired }}
                                            {{ end }}
                                          </span>
                                          {{ if eq $childStatusClass "ok" }}
                                            <svg class="child-service-status" fill="var(--color-positive)" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20">
                                              <circle cx="10" cy="10" r="6"/>
                                            </svg>
                                          {{ else if eq $childStatusClass "paused" }}
                                            <svg class="child-service-status" fill="var(--color-text-base)" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20">
                                              <circle cx="10" cy="10" r="6"/>
                                            </svg>
                                          {{ else }}
                                            <svg class="child-service-status" fill="var(--color-negative)" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20">
                                              <circle cx="10" cy="10" r="6"/>
                                            </svg>
                                          {{ end }}
                                        </div>
                                      {{ end }}
                                    {{ end }}
                                  {{ end }}
                                </div>
                              {{ end }}
                            {{ end }}
                          </div>
                        </div>
                        
                        <div class="min-width-0 grow flex items-center gap-10">
                          <div class="service-name">
                            {{ if $url }}
                              <a href="{{ $url }}" class="color-highlight text-truncate" target="_blank" rel="noreferrer">{{ $name }}</a>
                            {{ else }}
                              <span class="color-highlight text-truncate">{{ $name }}</span>
                            {{ end }}
                          </div>
                          
                          <div class="service-replicas">
                            {{ if $isGlobal }}
                              global
                            {{ else if and $running $desired }}
                              {{ $running }}/{{ $desired }}
                            {{ else }}
                              -/-
                            {{ end }}
                          </div>
                        </div>
                        
                        <div class="shrink-0" 
                             data-popover-type="text" 
                             data-popover-position="above" 
                             data-popover-text="{{ if $isGlobal }}running (global){{ else if eq $statusClass "ok" }}running{{ else if eq $statusClass "paused" }}scaling{{ else }}stopped{{ end }}"
                             aria-label="{{ if $isGlobal }}running (global){{ else if eq $statusClass "ok" }}running{{ else if eq $statusClass "paused" }}scaling{{ else }}stopped{{ end }}">
                          {{ if eq $statusClass "ok" }}
                            <svg class="docker-container-status-icon" fill="var(--color-positive)" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" aria-hidden="true">
                              <path fill-rule="evenodd" d="M10 18a8 8 0 1 0 0-16 8 8 0 0 0 0 16Zm3.857-9.809a.75.75 0 0 0-1.214-.882l-3.483 4.79-1.88-1.88a.75.75 0 1 0-1.06 1.061l2.5 2.5a.75.75 0 0 0 1.137-.089l4-5.5Z" clip-rule="evenodd" />
                            </svg>
                          {{ else if eq $statusClass "warn" }}
                            <svg class="docker-container-status-icon" fill="var(--color-negative)" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" aria-hidden="true">
                              <path fill-rule="evenodd" d="M8.485 2.495c.673-1.167 2.357-1.167 3.03 0l6.28 10.875c.673 1.167-.17 2.625-1.516 2.625H3.72c-1.347 0-2.189-1.458-1.515-2.625L8.485 2.495ZM10 5a.75.75 0 0 1 .75.75v3.5a.75.75 0 0 1-1.5 0v-3.5A.75.75 0 0 1 10 5Zm0 9a1 1 0 1 0 0-2 1 1 0 0 0 0 2Z" clip-rule="evenodd" />
                            </svg>
                          {{ else if eq $statusClass "paused" }}
                            <svg class="docker-container-status-icon" fill="var(--color-text-base)" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" aria-hidden="true">
                              <path fill-rule="evenodd" d="M2 10a8 8 0 1 1 16 0 8 8 0 0 1-16 0Zm5-2.25A.75.75 0 0 1 7.75 7h.5a.75.75 0 0 1 .75.75v4.5a.75.75 0 0 1-.75.75h-.5a.75.75 0 0 1-.75-.75v-4.5Zm4 0a.75.75 0 0 1 .75-.75h.5a.75.75 0 0 1 .75.75v4.5a.75.75 0 0 1-.75.75h-.5a.75.75 0 0 1-.75-.75v-4.5Z" clip-rule="evenodd" />
                            </svg>
                          {{ else }}
                            <svg class="docker-container-status-icon" fill="var(--color-text-base)" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" aria-hidden="true">
                              <path fill-rule="evenodd" d="M18 10a8 8 0 1 1-16 0 8 8 0 0 1 16 0ZM8.94 6.94a.75.75 0 1 1-1.061-1.061 3 3 0 1 1 2.871 5.026v.345a.75.75 0 0 1-1.5 0v-.5c0-.72.57-1.172 1.081-1.287A1.5 1.5 0 1 0 8.94 6.94ZM10 15a1 1 0 1 0 0-2 1 1 0 0 0 0 2Z" clip-rule="evenodd" />
                            </svg>
                          {{ end }}
                        </div>
                        
                        <div class="visually-hidden" aria-label="{{ if $isGlobal }}Mode: Global{{ else }}Replicas: {{ $running }}/{{ $desired }}{{ end }}"></div>
                      </li>
                    {{ end }}
                  {{ end }}
                {{ end }}
              </ul>

          - type: bookmarks
            groups:
              - title: Infraestrutura & Rede
                links:
                  - title: AdGuard Home
                    url: https://adguard.arpa
                    icon: mdi:shield-check
                  - title: Glances
                    url: https://glances.arpa
                    icon: mdi:cpu-64-bit