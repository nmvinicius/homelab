server {
    listen 80 default_server;
    listen 443 ssl default_server;
    http2 on;
    server_name _;

    # Certificado autoassinado apenas para evitar erro de conexão
    # em acessos por IP ou nomes não configurados
    ssl_certificate     /etc/nginx/certs/wildcard.arpa.fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/wildcard.arpa.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    location / {
        return 404;
    }

    location /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
