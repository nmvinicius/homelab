# Exceção para o AdGuard (rodando no Host em modo de rede host na 8080)
server {
    listen 80;
    server_name adguard.arpa;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Aponta diretamente para o loopback do Orange Pi na porta 8080
        proxy_pass http://127.0.0.1:8080;
    }
}

# Regra genérica/wildcard para outros apps na rede overlay (homelab)
server {
    listen 80;
    server_name ~^(?<app>[a-z0-9-]+)\.arpa$;

    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_pass http://$app:80;
    }
}