# =============================================================================
# Configurações TLS compartilhadas (HTTP/2, SSL, headers de segurança)
# =============================================================================

# Redirect HTTP → HTTPS para todos os domínios *.arpa
server {
    listen 80;
    server_name *.arpa arpa;

    return 301 https://$host$request_uri;
}

# ---------------------------------------------------------------------------
# AdGuard — HTTPS (backend roda no host em modo host, porta 8080)
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name adguard.arpa;

    # --- Certificado Wildcard ---
    ssl_certificate     /etc/nginx/certs/wildcard.arpa.fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/wildcard.arpa.key;

    # --- Parâmetros TLS modernos (A+ no SSL Labs) ---
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_dhparam /etc/nginx/certs/dhparam.pem;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling off;  # Incompatível com CA interna (sem OCSP público)

    # --- Headers de segurança ---
    add_header Strict-Transport-Security "max-age=63072000" always;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_pass http://192.168.1.113:8080;
    }
}

# ---------------------------------------------------------------------------
# Glance — HTTPS (serviço roda na porta 8080)
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name home.arpa;

    ssl_certificate     /etc/nginx/certs/wildcard.arpa.fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/wildcard.arpa.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_dhparam /etc/nginx/certs/dhparam.pem;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling off;

    add_header Strict-Transport-Security "max-age=63072000" always;

    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_pass http://glance:8080$request_uri;
    }
}

# ---------------------------------------------------------------------------
# Wildcard genérico para outros apps na rede overlay (homelab)
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name ~^(?<app>[a-z0-9-]+)\.arpa$;

    # --- Certificado Wildcard ---
    ssl_certificate     /etc/nginx/certs/wildcard.arpa.fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/wildcard.arpa.key;

    # --- Parâmetros TLS ---
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_dhparam /etc/nginx/certs/dhparam.pem;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling off;

    add_header Strict-Transport-Security "max-age=63072000" always;

    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_pass http://$app:80;
    }
}