version: "3.9"

services:
  adguard:
    image: adguard/adguardhome:latest
    environment:
      - TZ=${TZ:-UTC}
    volumes:
      - adguard_work:/opt/adguardhome/work
      - ../../configs/adguard:/opt/adguardhome/conf
    networks:
      - hostnet
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any

  nginx:
    image: nginx:1.27-alpine
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: host
      - target: 443
        published: 443
        protocol: tcp
        mode: host
    configs:
      - source: nginx_default_conf
        target: /etc/nginx/conf.d/default.conf
      - source: nginx_apps_wildcard_conf
        target: /etc/nginx/conf.d/apps.wildcard.arpa.conf
    volumes:
      - nginx_html:/usr/share/nginx/html:ro
      - ../../certs:/etc/nginx/certs:ro
    networks:
      - homelab
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    volumes:
      - ./configs/homepage:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
    deploy:
      resources:
        limits:
          memory: 128M
    environment:
      HOMEPAGE_ALLOWED_HOSTS: home.arpa
    networks:
      - homelab

configs:
  nginx_default_conf:
    file: ../../configs/nginx/default.conf
  nginx_apps_wildcard_conf:
    file: ../../configs/nginx/apps.wildcard.arpa.conf

volumes:
  adguard_work:
  nginx_html:

networks:
  homelab:
    driver: overlay
    attachable: true
  hostnet:
    external: true
    name: host