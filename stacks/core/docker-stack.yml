version: "3.9"

services:
  adguard:
    image: adguard/adguardhome:latest
    environment:
      - TZ=${TZ:-UTC}
    volumes:
      - adguard_work:/opt/adguardhome/work
      - ../../configs/adguard:/opt/adguardhome/conf
    networks:
      - hostnet
    deploy:
      labels:
        - "glance.name=AdGuard Home"
        - "glance.icon=di:adguard-home"
        - "glance.url=https://adguard.arpa"
        - "glance.description=DNS e bloqueio de anúncios"
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any

  nginx:
    image: nginx:1.27-alpine
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: host
      - target: 443
        published: 443
        protocol: tcp
        mode: host
    configs:
      - source: nginx_default_conf
        target: /etc/nginx/conf.d/default.conf
      - source: nginx_apps_wildcard_conf
        target: /etc/nginx/conf.d/apps.wildcard.arpa.conf
    volumes:
      - nginx_html:/usr/share/nginx/html:ro
      - ../../certs:/etc/nginx/certs:ro
    networks:
      - homelab
    deploy:
      labels:
        - "glance.name=Nginx"
        - "glance.icon=di:nginx"
        - "glance.url=https://home.arpa"
        - "glance.description=Proxy reverso e TLS"
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any
  glance:
    image: glanceapp/glance:latest
    environment:
      OPENWATERMAP_APIKEY: ${OPENWATERMAP_APIKEY:?OPENWATERMAP_APIKEY is required in stacks/core/.env}
    volumes:
      - ../../configs/glance:/app/config:ro
    networks:
      - homelab
    deploy:
      labels:
        - "glance.name=Glance"
        - "glance.icon=mdi:view-dashboard"
        - "glance.url=https://home.arpa"
        - "glance.description=Dashboard pessoal"

  glance-docker-swarm-proxy:
    image: tecnativa/docker-socket-proxy:latest
    environment:
      - LOG_LEVEL=info
      - SERVICES=1
      - NODES=1
      - TASKS=1
      - NETWORKS=1
      - CONTAINERS=1
      - INFO=1
      - POST=0
      - BUILD=0
      - COMMIT=0
      - EXEC=0
      - IMAGES=0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - homelab
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any

configs:
  nginx_default_conf:
    name: ${STACK_NAME}_nginx_default_conf_${NGINX_DEFAULT_CONF_HASH}
    file: ../../configs/nginx/default.conf
  nginx_apps_wildcard_conf:
    name: ${STACK_NAME}_nginx_apps_wildcard_conf_${NGINX_APPS_WILDCARD_CONF_HASH}
    file: ../../configs/nginx/apps.wildcard.arpa.conf

volumes:
  adguard_work:
  nginx_html:

networks:
  homelab:
    driver: overlay
    attachable: true
  hostnet:
    external: true
    name: host